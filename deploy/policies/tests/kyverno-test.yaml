apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: workload-baseline
policies:
  - ../workload-baseline.yaml
resources:
  - resources.yaml
variables: values.yaml
results:
  - policy: workload-baseline
    kind: Pod
    resources: [compliant]
    result: pass
  - policy: workload-baseline
    kind: Pod
    resources: [no-memory-limit, no-probes, tag-only-image, foreign-registry]
    result: fail
  - policy: workload-baseline
    kind: Pod
    resources: [platform-pod]
    result: skip
  - policy: workload-baseline
    kind: Rollout
    resources: [rollout-without-probes]
    result: fail
