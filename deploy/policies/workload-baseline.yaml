# Baseline every workload must meet. The same file runs in CI (`kyverno apply`
# against the rendered chart) and in the cluster (admission), so a change that
# would be rejected at deploy time already fails the pull request.
#
# Scope: namespaces labelled workload-namespace=true (set by the ApplicationSet).
# Rollouts are validated as well as Pods, so a violation shows up as a failed
# Argo CD sync instead of a ReplicaSet that silently can't create pods.
# Pod Security "restricted" is enforced natively through namespace labels and
# is not repeated here.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: workload-baseline
spec:
  validationActions: [Deny]
  matchConstraints:
    namespaceSelector:
      matchLabels:
        workload-namespace: "true"
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
      - apiGroups: [argoproj.io]
        apiVersions: [v1alpha1]
        operations: [CREATE, UPDATE]
        resources: [rollouts]
  variables:
    - name: containers
      expression: "object.kind == 'Pod' ? object.spec.containers : object.spec.template.spec.containers"
  validations:
    # The scheduler needs requests to place the pod; the memory limit stops a
    # leak from taking the whole node down with it.
    - expression: >-
        variables.containers.all(c,
          has(c.resources) && has(c.resources.requests) &&
          'cpu' in c.resources.requests && 'memory' in c.resources.requests &&
          has(c.resources.limits) && 'memory' in c.resources.limits)
      message: every container must set cpu/memory requests and a memory limit

    # No readiness: traffic reaches pods that can't serve it.
    # No liveness: a hung JVM is never restarted.
    - expression: "variables.containers.all(c, has(c.readinessProbe) && has(c.livenessProbe))"
      message: every container needs a readinessProbe and a livenessProbe

    # Together with verify-image-provenance this means only images built and
    # signed by our CI on main can run here.
    - expression: >-
        variables.containers.all(c,
          c.image.startsWith('ghcr.io/taovietducofficial/') && c.image.contains('@sha256:'))
      message: images must come from ghcr.io/taovietducofficial/ and be pinned by digest (@sha256:...)
