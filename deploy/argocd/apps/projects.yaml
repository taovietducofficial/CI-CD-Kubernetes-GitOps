# Two trust zones. The platform project can install anything anywhere, so only
# the platform team should be able to change what's in it. The apps project
# can only put a fixed list of namespaced kinds into app-* namespaces: a chart
# change can't create a ClusterRole, touch kube-system, or disable a policy.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd
spec:
  description: Cluster add-ons and the GitOps machinery itself
  sourceRepos:
    - https://github.com/taovietducofficial/CI-CD-Kubernetes-GitOps.git
    - https://argoproj.github.io/argo-helm
    - https://kyverno.github.io/kyverno
    - https://bitnami.github.io/sealed-secrets
    - https://prometheus-community.github.io/helm-charts
    - https://kubernetes-sigs.github.io/metrics-server/
  destinations:
    - server: https://kubernetes.default.svc
      namespace: "*"
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: apps
  namespace: argocd
spec:
  description: Product workloads
  sourceRepos:
    - https://github.com/taovietducofficial/CI-CD-Kubernetes-GitOps.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: app-*
  clusterResourceWhitelist:
    # Only so the ApplicationSet can create (and label) its own namespace.
    - group: ""
      kind: Namespace
  namespaceResourceWhitelist:
    - { group: "", kind: Service }
    - { group: argoproj.io, kind: Rollout }
    - { group: argoproj.io, kind: AnalysisTemplate }
    - { group: autoscaling, kind: HorizontalPodAutoscaler }
    - { group: policy, kind: PodDisruptionBudget }
    - { group: networking.k8s.io, kind: NetworkPolicy }
    - { group: monitoring.coreos.com, kind: PodMonitor }
    - { group: monitoring.coreos.com, kind: PrometheusRule }
    - { group: bitnami.com, kind: SealedSecret }
