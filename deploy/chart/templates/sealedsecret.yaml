{{- with .Values.sealedSecrets }}
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: {{ $.Release.Name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "demo.labels" $ | nindent 4 }}
spec:
  # Default "strict" scope: the ciphertext only decrypts to this exact
  # name in this exact namespace, so it can't be copied to another env.
  encryptedData:
    {{- toYaml . | nindent 4 }}
  template:
    metadata:
      name: {{ $.Release.Name }}
      labels:
        {{- include "demo.labels" $ | nindent 8 }}
{{- end }}
