{{- if .Values.monitoring.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "demo.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "demo.selectorLabels" . | nindent 6 }}
  # Copies the pod's rollouts-pod-template-hash onto every series, which is
  # how canary analysis tells canary pods apart from stable ones.
  podTargetLabels:
    - rollouts-pod-template-hash
  podMetricsEndpoints:
    - port: management
      path: /actuator/prometheus
      interval: 15s
{{- end }}
